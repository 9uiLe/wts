name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Verify environment and build
        run: |
          test -z "$(git status --porcelain)"
          ./scripts/setup.sh
          nix develop --no-update-lock-file --command bun run verify:deps
          ./scripts/check.sh
          git diff --exit-code
