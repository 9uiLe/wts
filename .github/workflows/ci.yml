name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Verify environment and build
        run: |
          test -z "$(git status --porcelain)"
          ./scripts/setup.sh
          nix develop --no-update-lock-file --command bun run verify:deps
          ./scripts/check.sh
          nix develop --no-update-lock-file --command bun run ui:catalog
          git diff --exit-code
      - name: Upload terminal UI review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-ui-review
          path: release/ui-catalog/
          if-no-files-found: error
